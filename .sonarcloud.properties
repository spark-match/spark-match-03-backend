# =============================================================================
# SonarCloud local configuration
# =============================================================================
# This file overrides defaults at the project level. The spark-match-01-devops
# recipe (`sonar-typescript.yml`) passes many `-Dsonar.*` flags via the CLI which
# OVERRIDE values defined here for the same property. Use this file for properties
# the recipe does not set explicitly.
#
# Specific override below: tell SonarCloud that test files (which the recipe
# already analyses for smells/branches) should NOT contribute their branches to
# `new_branch_coverage`. Without this, PRs that only modify test files fail
# the new_branch_coverage >= 80% QG threshold because vitest excludes test files
# from coverage tracking (per `coverage.exclude: ['**/*.test.ts']` in
# vitest.config.mts) — so their branches look 0% covered to SonarCloud.
#
# This file works around that tooling mismatch without changing the devops recipe.
# =============================================================================

# Treat all test files as "test code" so SonarCloud excludes them from
# new_branch_coverage analysis (since we don't generate coverage data for them).
# Note: this is additive to the devops recipe's existing -Dsonar.test.exclusions
# value, which the CLI passes explicitly.
sonar.test.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,**/.aws-sam/**,**/*.d.ts,**/*.test.ts,**/*.spec.ts
