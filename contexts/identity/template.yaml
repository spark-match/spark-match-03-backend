  # ===========================================================================
  # IdentityAuthorizerFunction - HttpApi v2 Lambda Authorizer (REQUEST).
  # ===========================================================================
  # Invoked by API Gateway BEFORE the protected handler. Uses the Simple
  # Response format (no IAM permissions to invoke downstream Lambdas are
  # required). On success, the returned context (userId/email/role) is
  # attached to event.requestContext.authorizer.lambda and picked up by
  # the handler's requireAuth middleware.
  # ===========================================================================
  IdentityAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        # El bundle ESM contiene dependencias CJS (AWS SDK, smithy) que llaman
        # `require` en runtime; sin este shim el init muere con
        #   Dynamic require of "node:https" is not supported
        # Mismo banner que usa scripts/bundle-migrate.mjs.
        Banner:
          - js=import{createRequire as __sparkRequire}from'node:module';const require=__sparkRequire(import.meta.url);
        OutExtension:
          - .js=.mjs
        Target: node24
        Sourcemap: true
        External:
          - pg-native
        EntryPoints:
          - authorizer.ts
    Properties:
      FunctionName: !Sub 'spark-match-identity-authorizer-${Environment}'
      CodeUri: ./src/handlers
      Handler: authorizer.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/spark-match-lambda-runtime-${Environment}'
      Description: HttpApi Lambda Authorizer - verifies JWT and attaches userId/email/role to the request context
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: !Sub 'identity-authorizer-${Environment}'
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue

  # El AWS::ApiGatewayV2::Authorizer lo genera SAM a partir de
  # HttpApi.Auth.Authorizers.IdentityAuthorizer (ver el bloque Auth del
  # recurso HttpApi). Declararlo a mano era lo que rompia el transform:
  # `Auth.Authorizer` de un evento HttpApi tiene que nombrar una entrada de
  # ese mapa, no apuntar por !Ref a un recurso crudo. Las rutas optan por el
  # con `Auth: { Authorizer: IdentityAuthorizer }`.
  #
  # La AWS::Lambda::Permission, en cambio, SI hay que declararla: para
  # authorizers de HttpApi, SAM no la crea (si lo hace para las funciones de
  # cada ruta, y para authorizers de Api REST). Verificado contra el stack
  # desplegado: get-me tenia su permission auto-generada
  # (...IdentityGetMeFunctionGetMeApiPermission...) y el authorizer no tenia
  # resource policy alguna, asi que API Gateway no podia invocarlo y toda
  # ruta protegida devolvia 500 sin dejar rastro en CloudWatch (la Lambda
  # nunca llegaba a ejecutarse).
  IdentityAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IdentityAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # ===========================================================================
  # IdentityMigrateFunction - runs node-pg-migrate against RDS
  # ===========================================================================
  # NOT exposed via HTTP. Invoked directly via:
  #   aws lambda invoke \
  #     --function-name spark-match-identity-migrate-dev \
  #     --payload '{"direction":"up"}' \
  #     out.json
  # IAM-based auth (lambda:InvokeFunction) replaces the previous token-based
  # auth so there is no static secret to rotate and no HTTP surface to
  # attack.
  #
  # BuildMethod es `makefile` y no `esbuild` porque el artefacto necesita algo
  # que esbuild no empaqueta: los 4 .sql de migrations/, que el handler lee en
  # runtime con resolve(process.cwd(), 'migrations') = /var/task/migrations.
  # Ver Makefile en este mismo directorio.
  #
  # El DSN ya no se inyecta por env var: se lee del SecureString
  # /spark-match/{env}/config/db-connection-url en runtime. `{{resolve:ssm:}}`
  # no descifra SecureString y `{{resolve:ssm-secure:}}` no esta soportado
  # dentro de Environment.Variables de una Lambda.
  # ===========================================================================
  IdentityMigrateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub 'spark-match-identity-migrate-${Environment}'
      CodeUri: ./
      Handler: migrate.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/spark-match-lambda-runtime-${Environment}'
      Description: Apply node-pg-migrate migrations against RDS (direct invoke, not HTTP)
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: !Sub 'identity-migrate-${Environment}'
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue

  # ===========================================================================
  # IdentityAuditFunction - GET /v1/audit (admin only)
  # ===========================================================================
  # Lists identity.audit_log with filters + cursor pagination. Requires
  # role === 'admin' enforced in the service layer (not the handler).
  # Index usage: the (occurred_at DESC) index covers the default order;
  # the partial (subject_user_id, occurred_at DESC) and
  # (action, occurred_at DESC) indexes accelerate the most common
  # filters. See V004 audit_log indexes.
  # ===========================================================================
  IdentityAuditFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        # El bundle ESM contiene dependencias CJS (AWS SDK, smithy) que llaman
        # `require` en runtime; sin este shim el init muere con
        #   Dynamic require of "node:https" is not supported
        # Mismo banner que usa scripts/bundle-migrate.mjs.
        Banner:
          - js=import{createRequire as __sparkRequire}from'node:module';const require=__sparkRequire(import.meta.url);
        OutExtension:
          - .js=.mjs
        Target: node24
        Sourcemap: true
        External:
          - pg-native
        EntryPoints:
          - audit.ts
    Properties:
      FunctionName: !Sub 'spark-match-identity-audit-${Environment}'
      CodeUri: ./src/handlers
      Handler: audit.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/spark-match-lambda-runtime-${Environment}'
      Description: Admin-only audit log read endpoint with filters + cursor pagination
      Events:
        AuditApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/audit
            Method: GET
            # Throttling en HttpApi.RouteSettings ('GET /v1/audit').
            Auth:
              Authorizer: IdentityAuthorizer
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: !Sub 'identity-audit-${Environment}'
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue

Outputs:
  IdentityRegisterFunctionArn:
    Value: !GetAtt IdentityRegisterFunction.Arn
  IdentityLoginFunctionArn:
    Value: !GetAtt IdentityLoginFunction.Arn
  IdentityGetMeFunctionArn:
    Value: !GetAtt IdentityGetMeFunction.Arn
  IdentityUpdateProfileFunctionArn:
    Value: !GetAtt IdentityUpdateProfileFunction.Arn
  IdentityChangePasswordFunctionArn:
    Value: !GetAtt IdentityChangePasswordFunction.Arn
  IdentityListUsersFunctionArn:
    Value: !GetAtt IdentityListUsersFunction.Arn
  IdentityAuditFunctionArn:
    Value: !GetAtt IdentityAuditFunction.Arn
  IdentityActivateUserFunctionArn:
    Value: !GetAtt IdentityActivateUserFunction.Arn
  IdentityDeactivateUserFunctionArn:
    Value: !GetAtt IdentityDeactivateUserFunction.Arn
  IdentityUpdateUserFunctionArn:
    Value: !GetAtt IdentityUpdateUserFunction.Arn
  IdentityAuthorizerFunctionArn:
    Value: !GetAtt IdentityAuthorizerFunction.Arn
  IdentityMigrateFunctionArn:
    Value: !GetAtt IdentityMigrateFunction.Arn

  HttpApiUrl:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  HttpApiId:
    Description: HTTP API Gateway ID
    Value: !Ref HttpApi
