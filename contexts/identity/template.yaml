AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Identity Context - Authentication, user registration, profile management.

Parameters:
  Environment:
    Type: String
    Default: dev
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch Logs retention for the identity Lambdas.
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Comma-separated list of VPC subnet IDs (for VPC-attached Lambdas).
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Comma-separated list of security group IDs (for VPC-attached Lambdas).
  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: '*'
    Description: Comma-separated list of allowed CORS origins (forwarded from root stack).

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 512
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: !Sub 'identity-${Environment}'
        ENVIRONMENT: !Ref Environment
        CORS_ALLOWED_ORIGINS: !Join [',', !Ref CorsAllowedOrigins]
        # Los bundles se generan con sourcemap; sin esta flag los stack traces
        # de CloudWatch apuntan al JS bundleado en vez del TypeScript original.
        NODE_OPTIONS: --enable-source-maps

Conditions:
  HasVpcConfig: !Not [!Equals [!Join ['', !Ref VpcSubnetIds], '']]

Resources:
  # ===========================================================================
  # API Gateway HTTP API v2
  # ===========================================================================
  # La API vive en ESTE stack, no en el raiz, por una restriccion dura del
  # transform de SAM: el event source `HttpApi` exige que `ApiId` referencie un
  # recurso AWS::Serverless::HttpApi del MISMO template. Pasarlo como parametro
  # String desde el stack padre hacia fallar el transform con
  # "ApiId must be a valid reference to an 'AWS::Serverless::HttpApi' resource
  # in same template" en las 10 funciones con ruta HTTP -- no solo en
  # `sam build`, sino tambien al crear el change set, porque el error lo emite
  # el transform y no el CLI.
  #
  # El stack raiz re-exporta HttpApiUrl y HttpApiId desde los outputs de este
  # stack, asi que los consumidores externos no ven el cambio.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: !Sub 'Spark Match Backend API (${Environment})'
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        ExposeHeaders:
          - X-Correlation-Id
        MaxAge: 600
      # El authorizer se declara aca, no como AWS::ApiGatewayV2::Authorizer
      # suelto: el evento HttpApi de SAM espera en `Auth.Authorizer` el NOMBRE
      # (string) de una entrada de este mapa. Con un `!Ref` a un recurso crudo,
      # el transform aborta con
      #   The method authorizer must be a string with a corresponding dict
      #   entry in the api authorizer
      # Sin DefaultAuthorizer a proposito: /v1/auth/register y /v1/auth/login
      # son publicos.
      Auth:
        Authorizers:
          IdentityAuthorizer:
            FunctionArn: !GetAtt IdentityAuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            # 0 = sin cache. El handler necesita ver revocaciones de rol al
            # instante; el authorizer resuelve en ~10 ms.
            Identity:
              Headers:
                - Authorization
              ReauthorizeEvery: 0
      # Throttling por ruta. En HTTP API v2 vive en el stage (RouteSettings),
      # no en el evento: `ThrottleSettings` solo existe para el tipo Api (REST)
      # y el transform lo rechaza con
      #   property ThrottleSettings not defined for resource of type HttpApi
      # Las claves son route keys "<METHOD> <path>". Limites de ADR-018.
      RouteSettings:
        'POST /v1/auth/register':
          # anti-bot signup
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        'POST /v1/auth/login':
          # anti-brute-force IP-level
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        'GET /v1/audit':
          # query costosa: cursor pagination + joins a identity.audit_log
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40
      Tags:
        Project: spark-match
        Environment: !Ref Environment

  IdentityRegisterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-register-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityLoginLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-login-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityGetMeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-get-me-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityUpdateProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-update-profile-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityChangePasswordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-change-password-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityListUsersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-list-users-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityActivateUserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-activate-user-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityDeactivateUserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-deactivate-user-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityUpdateUserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-update-user-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityAuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-authorizer-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  # Estos dos faltaban: sin el LogGroup declarado, Lambda lo crea al primer
  # invoke con retencion "Never expire", que no se puede corregir despues sin
  # importarlo al stack.
  IdentityMigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-migrate-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays
  IdentityAuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spark-match-identity-audit-${Environment}'
      RetentionInDays: !Ref LogRetentionInDays

  IdentityRegisterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        # El bundle ESM contiene dependencias CJS (AWS SDK, smithy) que llaman
        # `require` en runtime; sin este shim el init muere con
        #   Dynamic require of "node:https" is not supported
        # Mismo banner que usa scripts/bundle-migrate.mjs.
        Banner:
          - js=import{createRequire as __sparkRequire}from'node:module';const require=__sparkRequire(import.meta.url);
        OutExtension:
          - .js=.mjs
        Target: node24
        Sourcemap: true
        External:
          - pg-native
        EntryPoints:
          - register.ts
    Properties:
      FunctionName: !Sub 'spark-match-identity-register-${Environment}'
      CodeUri: ./src/handlers
      Handler: register.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/spark-match-lambda-runtime-${Environment}'
      Description: Register a new user (POST /v1/auth/register)
      Events:
        RegisterApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/auth/register
            Method: POST
            # Throttling en HttpApi.RouteSettings ('POST /v1/auth/register').
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue

  IdentityLoginFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        # El bundle ESM contiene dependencias CJS (AWS SDK, smithy) que llaman
        # `require` en runtime; sin este shim el init muere con
        #   Dynamic require of "node:https" is not supported
        # Mismo banner que usa scripts/bundle-migrate.mjs.
        Banner:
          - js=import{createRequire as __sparkRequire}from'node:module';const require=__sparkRequire(import.meta.url);
        OutExtension:
          - .js=.mjs
        Target: node24
        Sourcemap: true
        External:
          - pg-native
        EntryPoints:
          - login.ts
    Properties:
      FunctionName: !Sub 'spark-match-identity-login-${Environment}'
      CodeUri: ./src/handlers
      Handler: login.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/spark-match-lambda-runtime-${Environment}'
      Description: Login user (POST /v1/auth/login)
      Events:
        LoginApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/auth/login
            Method: POST
            # Throttling en HttpApi.RouteSettings ('POST /v1/auth/login').
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue

  IdentityGetMeFunction:
    Type: AWS::Serverless::Function
    Metadata:
