AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::Serverless-2016-10-31

Description: >
  Spark Match Backend - Serverless DDD+EDA monolith (TypeScript on Node.js, AWS Lambda).
  The Python AI Advisor lives in the sibling repo spark-match-07-deep-agent.
  See docs/architecture.md for the full design.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment.

  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: '*'
    Description: >-
      Comma-separated list of allowed CORS origins. Use `*` to allow
      any origin (dev/staging only). For prod, pass an explicit list
      e.g. `https://app.example.com,https://admin.example.com`. The
      handler echoes the request's `Origin` back when it matches the
      list; otherwise it omits `Access-Control-Allow-Origin` so the
      browser blocks the response. This applies to both the API
      Gateway HttpApi (via !Split) and the inline handler CORS.

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch Logs retention in days.

  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: VPC subnet IDs for VPC-attached Lambdas (leave empty for non-VPC dev runs).

  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Security group IDs for VPC-attached Lambdas (leave empty for non-VPC dev runs).

# Sin bloque `Globals`: este stack no declara ninguna funcion propia (todas
# viven en IdentityStack) y los Globals de SAM no cruzan hacia stacks
# anidados. El bloque anterior definia cuatro env vars con
# `{{resolve:ssm:/spark-match/...}}` apuntando a rutas que no existen en
# ninguna cuenta -- el contrato real es /spark-match/{env}/config/* (ADR-0002)
# y hoy se resuelve en runtime, no en tiempo de deploy.

Resources:
  # ===========================================================================
  # Nested stack: Identity Context
  # ===========================================================================
  # Ya no se pasan ARNs de layers: el empaquetado paso a `BuildMethod: esbuild`
  # por funcion, que bundlea el TypeScript y sus dependencias dentro del
  # artefacto. Eso elimina de un golpe los layers (que ademas nunca llegaron a
  # construirse bien) y el drift de versiones entre el codigo y lo que el layer
  # traia.
  IdentityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./contexts/identity/template.yaml
      Parameters:
        Environment: !Ref Environment
        LogRetentionInDays: !Ref LogRetentionInDays
        VpcSubnetIds: !Join [',', !Ref VpcSubnetIds]
        VpcSecurityGroupIds: !Join [',', !Ref VpcSecurityGroupIds]
        CorsAllowedOrigins: !Join [',', !Ref CorsAllowedOrigins]
      Tags:
        - Key: Project
          Value: spark-match
        - Key: Component
          Value: identity
        - Key: Environment
          Value: !Ref Environment

  # ===========================================================================
  # Nested stack: Reports Context
  # ===========================================================================
  # Trae su propia HttpApi en vez de colgarse de la de identity. El motivo
  # completo esta en el encabezado de contexts/reports/template.yaml; en corto:
  # la API de identity es un import de OpenAPI, y una ruta anadida desde otro
  # stack no sobrevive al siguiente deploy.
  #
  # No lleva `DependsOn`: el !GetAtt al output de IdentityStack ya crea la
  # dependencia, y anadirlo ademas seria repetir lo que CloudFormation deduce.
  ReportsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./contexts/reports/template.yaml
      Parameters:
        Environment: !Ref Environment
        LogRetentionInDays: !Ref LogRetentionInDays
        VpcSubnetIds: !Join [',', !Ref VpcSubnetIds]
        VpcSecurityGroupIds: !Join [',', !Ref VpcSecurityGroupIds]
        CorsAllowedOrigins: !Join [',', !Ref CorsAllowedOrigins]
        IdentityAuthorizerFunctionArn: !GetAtt IdentityStack.Outputs.IdentityAuthorizerFunctionArn
      Tags:
        - Key: Project
          Value: spark-match
        - Key: Component
          Value: reports
        - Key: Environment
          Value: !Ref Environment

  # ===========================================================================
  # CloudWatch Log Group (root)
  # ===========================================================================
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/spark-match/${Environment}/application'
      RetentionInDays: !Ref LogRetentionInDays
      Tags:
        - Key: Project
          Value: spark-match
        - Key: Environment
          Value: !Ref Environment

Outputs:
  # Re-exportados desde el stack anidado: la API se define alli por una
  # restriccion del transform de SAM (ver el comentario en
  # contexts/identity/template.yaml). Los nombres de export NO cambian, asi
  # que ningun consumidor externo se entera del movimiento.
  HttpApiUrl:
    Description: HTTP API Gateway endpoint URL
    Value: !GetAtt IdentityStack.Outputs.HttpApiUrl
    Export:
      Name: !Sub 'spark-match-${Environment}-HttpApiUrl'

  HttpApiId:
    Description: HTTP API Gateway ID
    Value: !GetAtt IdentityStack.Outputs.HttpApiId
    Export:
      Name: !Sub 'spark-match-${Environment}-HttpApiId'

  # La segunda URL base. El frontend necesita las dos: identity para todo lo de
  # sesion y perfil, esta para los informes.
  #
  # SIN `Export:`, por el mismo motivo que IdentityMigrateFunctionArn mas abajo,
  # y no por descuido: hoy NADIE hace ImportValue de los cuatro exports de este
  # stack -- se comprobo en los tres repos que despliegan. El smoke test de
  # deploy.yml lee estos dos con `describe-stacks`, que no necesita Export.
  # Anadirlo por simetria con HttpApiUrl seria crear un nombre global que
  # ademas congela el valor en cuanto alguien lo importe.
  ReportsHttpApiUrl:
    Description: Reports HTTP API Gateway endpoint URL
    Value: !GetAtt ReportsStack.Outputs.ReportsHttpApiUrl

  ReportsHttpApiId:
    Description: Reports HTTP API Gateway ID
    Value: !GetAtt ReportsStack.Outputs.ReportsHttpApiId

  IdentityStackVpcSubnetIds:
    Description: Comma-separated VPC subnet IDs forwarded to the identity nested stack (empty for non-VPC dev runs)
    Value: !Join [',', !Ref VpcSubnetIds]
    Export:
      Name: !Sub 'spark-match-${Environment}-IdentityStackVpcSubnetIds'

  IdentityStackVpcSecurityGroupIds:
    Description: Comma-separated security group IDs forwarded to the identity nested stack (empty for non-VPC dev runs)
    Value: !Join [',', !Ref VpcSecurityGroupIds]
    Export:
      Name: !Sub 'spark-match-${Environment}-IdentityStackVpcSecurityGroupIds'

  # Lo lee el paso `apply-database-migrations` de .github/workflows/deploy.yml
  # con `describe-stacks`, para no reconstruir a mano el nombre de la funcion.
  # El nested stack ya exponia este valor (contexts/identity/template.yaml);
  # aqui solo se re-exporta, como se hizo con HttpApiUrl.
  #
  # SIN `Export:`, a diferencia de los cuatro de arriba, y es deliberado:
  # `describe-stacks` lee los Outputs exporte o no. Un Export es un nombre
  # global que ademas congela el valor mientras alguien lo importe, y aqui no
  # lo importa nadie. Anadirlo por simetria seria decorado con consecuencias.
  IdentityMigrateFunctionArn:
    Description: ARN of the migration Lambda, invoked by the deploy pipeline after sam deploy
    Value: !GetAtt IdentityStack.Outputs.IdentityMigrateFunctionArn
