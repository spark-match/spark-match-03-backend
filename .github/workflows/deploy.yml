# =============================================================================
# Deploy - Manual SAM deploy to AWS via OIDC
# =============================================================================
# Inline workflow (NOT a reusable) on purpose. This is one of the few callers
# that needs AWS credentials and therefore cannot delegate to a generic
# reusable node-build (which does not assume an IAM role). The reusable
# `reusable-node-build.yml` from spark-match-01-devops is consumed elsewhere
# (spark-match-04-frontend) for non-AWS callers.
#
# Why inline (per AGENTS.md §12.2):
#   - Each SAM-deploying repo has a different role ARN prefix pinned by env.
#   - The `sam deploy --config-env` flag invokes `samconfig.toml` blocks that
#     are caller-specific (bucket name, stack name, parameter overrides).
#   - The OIDC trust chain is per-repo (sub claim pins repo:owner/name).
#   Consolidating into a reusable would require N inputs that vary per caller
#   (role ARN pattern, stack name, bucket prefix, region), defeating the
#   goal of reuse. The level of variance is too high to template cleanly.
#   What WOULD change to make this a reusable: a generic "sam-deploy" recipe
#   taking inputs {aws-region, role-arn-pattern, stack-name, parameter-overrides}.
#   Out of scope for this PR; tracked in docs/ci-cd-improvement-plan.md.
#
# Authentication:
#   - OIDC trust: assume role `spark-match-sam-deploy-${{ inputs.environment }}`
#     in account 681526276858. The role is created by
#     spark-match-02-infrastructure/modules/oidc-github (Fase 1, applied).
#   - Trust policy restricts `sub` claim to:
#     repo:spark-match/spark-match-03-backend:{ref:refs/heads/{dev,main} | environment:${{ inputs.environment }}}.
#     See spark-match-02-infrastructure/docs/IAM_ROLES.md §"spark-match-sam-deploy-{env}".
#   - The `environment: ${{ inputs.environment }}` job-level binding below
#     produces the `environment:<env>` sub pattern, which is the strictest
#     of the three accepted matchers.
#
# Required GH Environments (created 2026-08-04 via `gh api`):
#   - dev: deployment_branch_policy.custom_branch_policies=true (any branch)
#   - production: deployment_branch_policy.protected_branches=true (main only)
#   These were created in PR #128 / commit
#   <GH_ENV creation is a pre-flight of this PR, not a code change>.
#
# Why not a reusable from spark-match-01-devops:
#   - The reusable-sam-deploy.yml that would have been the natural fit was
#     DELETED in the stale-reusable cleanup (PR #201/#202 in 01-devops;
#     see 01-devops/AGENTS.md §11). Re-introducing it would require a
#     platform-team PR in 01-devops, out of scope here.
# =============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        # `staging` no esta: no existe infraestructura para el (ni VPC, ni RDS,
        # ni el rol spark-match-sam-deploy-staging). Dejarlo en la lista solo
        # servia para lanzar deploys que fallan al asumir el rol.
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

# Concurrency: never cancel an in-flight deploy (cancel-in-progress:
# false). Two concurrent deploys to the same env race on CloudFormation
# stack name + S3 bucket prefix and either fail or leave the stack in
# an indeterminate state. Group key includes inputs.environment so
# dev / staging / prod can deploy in parallel. Closes B15.
concurrency:
  group: deploy-${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `prod` mapea al GH Environment `production`, que ya tiene branch policy
    # (solo main). Usar `environment: prod` haria que GitHub creara al vuelo un
    # environment nuevo, sin ninguna proteccion. El sub del token OIDC pasa a
    # ser `environment:production`, que es justo lo que el trust policy del rol
    # de prod acepta (live/prod/main.tf: github_environment_name = "production").
    environment: ${{ inputs.environment == 'prod' && 'production' || 'dev' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-node-js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: setup-aws-sam-cli
        uses: aws-actions/setup-sam@v3

      # ------------------------------------------------------------------
      # Build workspace inline. A reusable workflow can only be invoked at
      # the job level (jobs.<id>.uses), never as a step -- GitHub rejects
      # the whole file at parse time with "reusable workflows should be
      # referenced at the top-level jobs.*.uses key".
      #
      # `build:shared` sigue siendo necesario aunque el empaquetado use
      # esbuild: el package @spark-match/shared expone su `exports` map
      # apuntando a ./dist, asi que sin compilarlo esbuild no resuelve los
      # imports `@spark-match/shared/*` de los handlers.
      #
      # Ya no se construyen layers: cada funcion se empaqueta con
      # `BuildMethod: esbuild` (o `makefile` en migrate).
      # ------------------------------------------------------------------
      - name: install-dependencies
        run: npm ci

      - name: build-shared-workspace
        run: npm run build:shared

      # ------------------------------------------------------------------
      # `sam build` invoca el NodejsNpmEsbuildBuilder, que resuelve el
      # binario `esbuild` por PATH (o por el node_modules/.bin del CodeUri
      # de cada funcion). Con npm workspaces, `npm ci` hoistea esbuild al
      # node_modules de la raiz, que no esta en el PATH del runner: ni el
      # CodeUri (`contexts/identity/src/handlers`) ni el PATH lo tienen, y
      # el build muere con
      #   Esbuild Failed: Cannot find esbuild. esbuild must be installed
      #   on the host machine to use this feature.
      #
      # Se expone el .bin de la raiz en vez de `npm i -g esbuild` para que
      # la version sea la que fija package-lock.json (0.28.1) y no una
      # flotante que cambie entre corridas.
      # ------------------------------------------------------------------
      # IdentityMigrateFunction se empaqueta antes de `sam build`, desde la
      # raiz del workspace. Su Makefile solo copia el resultado: el
      # CustomMakeBuilder de SAM corre make en un scratch dir donde no hay
      # node_modules ni `../../`, asi que ahi esbuild no resolveria nada.
      - name: bundle-migrate-function
        run: npm run bundle:migrate

      - name: expose-esbuild-on-path
        run: |
          set -euo pipefail
          BIN="${GITHUB_WORKSPACE}/node_modules/.bin"
          if [ ! -x "${BIN}/esbuild" ]; then
            echo "::error::${BIN}/esbuild no existe tras npm ci. Revisa que esbuild siga en devDependencies de la raiz."
            exit 1
          fi
          echo "${BIN}" >> "$GITHUB_PATH"
          "${BIN}/esbuild" --version

      # ------------------------------------------------------------------
      # OIDC credentials: assume spark-match-sam-deploy-<env> in the
      # 681526276858 AWS account. The role is created by
      # 02-infrastructure/modules/oidc-github (Fase 1 applied to dev).
      # The role ARN is computed inline from inputs.environment so this
      # file does not depend on a per-env repo var that would drift
      # between dev / staging / prod.
      #
      # aws-region is fixed to us-east-1; the SAM artifacts bucket,
      # all KMS keys, all VPCs, and the SAM-deploy role are scoped to
      # that region per 02-infrastructure's design.
      # ------------------------------------------------------------------
      - name: configure-aws-credentials-oidc-deploy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::681526276858:role/spark-match-sam-deploy-${{ inputs.environment }}
          aws-region: us-east-1

      # ------------------------------------------------------------------
      # Config de red y CORS desde SSM (contrato ADR-0002, publicado por
      # modules/ssm-bootstrap en 02-infrastructure).
      #
      # Sin este paso las Lambdas quedan FUERA de la VPC: la condicion
      # `HasVpcConfig` del template evalua a false cuando VpcSubnetIds llega
      # vacio, que es exactamente lo que pasaba porque nadie pasaba el
      # parametro. Una Lambda sin VPC no llega al RDS privado.
      #
      # Las comas se escapan con `\,` porque los tres son CommaDelimitedList y
      # `sam deploy --parameter-overrides` usa la coma como separador entre
      # parametros.
      # ------------------------------------------------------------------
      - name: read-network-and-cors-config-from-ssm
        id: config
        env:
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          get() {
            aws ssm get-parameter --name "/spark-match/${ENV_NAME}/config/$1" \
              --query Parameter.Value --output text
          }
          SUBNETS="$(get private-subnet-ids)"
          SGS="$(get lambda-security-group-id)"
          CORS="$(get cors-allowed-origins)"

          if [ -z "${SUBNETS}" ] || [ "${SUBNETS}" = "None" ]; then
            echo "::error::/spark-match/${ENV_NAME}/config/private-subnet-ids vacio: las Lambdas quedarian fuera de la VPC y no alcanzarian RDS."
            exit 1
          fi

          {
            echo "subnets=${SUBNETS//,/\\,}"
            echo "security-groups=${SGS//,/\\,}"
            echo "cors=${CORS//,/\\,}"
          } >> "$GITHUB_OUTPUT"

          echo "subnets=${SUBNETS} | sgs=${SGS} | cors=${CORS}"

      # `--use-container` no aplica: el empaquetado es esbuild + un makefile
      # que solo llama a esbuild y copia migrations/. Levantar la imagen de
      # build de Lambda solo agregaria minutos y una dependencia de Docker.
      - name: sam-build
        run: sam build

      - name: sam-deploy
        env:
          ENV_NAME: ${{ inputs.environment }}
          RETENTION: ${{ inputs.environment == 'prod' && '365' || '14' }}
          SUBNETS: ${{ steps.config.outputs.subnets }}
          SGS: ${{ steps.config.outputs.security-groups }}
          CORS: ${{ steps.config.outputs.cors }}
        run: |
          set -euo pipefail
          sam deploy \
            --config-env "${ENV_NAME}" \
            --no-fail-on-empty-changeset \
            --no-disable-rollback \
            --parameter-overrides \
              "Environment=${ENV_NAME}" \
              "LogRetentionInDays=${RETENTION}" \
              "VpcSubnetIds=${SUBNETS}" \
              "VpcSecurityGroupIds=${SGS}" \
              "CorsAllowedOrigins=${CORS}"
