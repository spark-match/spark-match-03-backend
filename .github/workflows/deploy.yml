# =============================================================================
# Deploy - Manual SAM deploy to AWS via OIDC
# =============================================================================
# Inline workflow (NOT a reusable) on purpose. This is one of the few callers
# that needs AWS credentials and therefore cannot delegate to a generic
# reusable node-build (which does not assume an IAM role). The reusable
# `reusable-node-build.yml` from spark-match-01-devops is consumed elsewhere
# (spark-match-04-frontend) for non-AWS callers.
#
# Why inline (per AGENTS.md §12.2):
#   - Each SAM-deploying repo has a different role ARN prefix pinned by env.
#   - The `sam deploy --config-env` flag invokes `samconfig.toml` blocks that
#     are caller-specific (bucket name, stack name, parameter overrides).
#   - The OIDC trust chain is per-repo (sub claim pins repo:owner/name).
#   Consolidating into a reusable would require N inputs that vary per caller
#   (role ARN pattern, stack name, bucket prefix, region), defeating the
#   goal of reuse. The level of variance is too high to template cleanly.
#   What WOULD change to make this a reusable: a generic "sam-deploy" recipe
#   taking inputs {aws-region, role-arn-pattern, stack-name, parameter-overrides}.
#   Out of scope for this PR; tracked in docs/ci-cd-improvement-plan.md.
#
# Authentication:
#   - OIDC trust: assume role `spark-match-sam-deploy-${{ inputs.environment }}`
#     in account 681526276858. The role is created by
#     spark-match-02-infrastructure/modules/oidc-github (Fase 1, applied).
#   - Trust policy restricts `sub` claim to:
#     repo:spark-match/spark-match-03-backend:{ref:refs/heads/{dev,main} | environment:${{ inputs.environment }}}.
#     See spark-match-02-infrastructure/docs/IAM_ROLES.md §"spark-match-sam-deploy-{env}".
#   - The `environment: ${{ inputs.environment }}` job-level binding below
#     produces the `environment:<env>` sub pattern, which is the strictest
#     of the three accepted matchers.
#
# Required GH Environments (created 2026-08-04 via `gh api`):
#   - dev: deployment_branch_policy.custom_branch_policies=true (any branch)
#   - production: deployment_branch_policy.protected_branches=true (main only)
#   These were created in PR #128 / commit
#   <GH_ENV creation is a pre-flight of this PR, not a code change>.
#
# Why not a reusable from spark-match-01-devops:
#   - The reusable-sam-deploy.yml that would have been the natural fit was
#     DELETED in the stale-reusable cleanup (PR #201/#202 in 01-devops;
#     see 01-devops/AGENTS.md §11). Re-introducing it would require a
#     platform-team PR in 01-devops, out of scope here.
#   - The `apply-database-migrations` step is inline for a different reason:
#     the catalog has NO recipe that invokes a Lambda at all, and the closest
#     one (reusable-migrations-dry-run.yml) cannot assume an AWS role. The
#     step carries its own justification and the shape a future
#     `reusable-lambda-invoke.yml` would need.
# =============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        # `staging` no esta: no existe infraestructura para el (ni VPC, ni RDS,
        # ni el rol spark-match-sam-deploy-staging). Dejarlo en la lista solo
        # servia para lanzar deploys que fallan al asumir el rol.
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

# Concurrency: never cancel an in-flight deploy (cancel-in-progress:
# false). Two concurrent deploys to the same env race on CloudFormation
# stack name + S3 bucket prefix and either fail or leave the stack in
# an indeterminate state. Group key includes inputs.environment so
# dev / staging / prod can deploy in parallel. Closes B15.
concurrency:
  group: deploy-${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `prod` mapea al GH Environment `production`, que ya tiene branch policy
    # (solo main). Usar `environment: prod` haria que GitHub creara al vuelo un
    # environment nuevo, sin ninguna proteccion. El sub del token OIDC pasa a
    # ser `environment:production`, que es justo lo que el trust policy del rol
    # de prod acepta (live/prod/main.tf: github_environment_name = "production").
    environment: ${{ inputs.environment == 'prod' && 'production' || 'dev' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-node-js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: setup-aws-sam-cli
        uses: aws-actions/setup-sam@v3

      # ------------------------------------------------------------------
      # Build workspace inline. A reusable workflow can only be invoked at
      # the job level (jobs.<id>.uses), never as a step -- GitHub rejects
      # the whole file at parse time with "reusable workflows should be
      # referenced at the top-level jobs.*.uses key".
      #
      # `build:shared` sigue siendo necesario aunque el empaquetado use
      # esbuild: el package @spark-match/shared expone su `exports` map
      # apuntando a ./dist, asi que sin compilarlo esbuild no resuelve los
      # imports `@spark-match/shared/*` de los handlers.
      #
      # Ya no se construyen layers: cada funcion se empaqueta con
      # `BuildMethod: esbuild` (o `makefile` en migrate).
      # ------------------------------------------------------------------
      - name: install-dependencies
        run: npm ci

      - name: build-shared-workspace
        run: npm run build:shared

      # ------------------------------------------------------------------
      # `sam build` invoca el NodejsNpmEsbuildBuilder, que resuelve el
      # binario `esbuild` por PATH (o por el node_modules/.bin del CodeUri
      # de cada funcion). Con npm workspaces, `npm ci` hoistea esbuild al
      # node_modules de la raiz, que no esta en el PATH del runner: ni el
      # CodeUri (`contexts/identity/src/handlers`) ni el PATH lo tienen, y
      # el build muere con
      #   Esbuild Failed: Cannot find esbuild. esbuild must be installed
      #   on the host machine to use this feature.
      #
      # Se expone el .bin de la raiz en vez de `npm i -g esbuild` para que
      # la version sea la que fija package-lock.json (0.28.1) y no una
      # flotante que cambie entre corridas.
      # ------------------------------------------------------------------
      # IdentityMigrateFunction se empaqueta antes de `sam build`, desde la
      # raiz del workspace. Su Makefile solo copia el resultado: el
      # CustomMakeBuilder de SAM corre make en un scratch dir donde no hay
      # node_modules ni `../../`, asi que ahi esbuild no resolveria nada.
      - name: bundle-migrate-function
        run: npm run bundle:migrate

      - name: expose-esbuild-on-path
        run: |
          set -euo pipefail
          BIN="${GITHUB_WORKSPACE}/node_modules/.bin"
          if [ ! -x "${BIN}/esbuild" ]; then
            echo "::error::${BIN}/esbuild no existe tras npm ci. Revisa que esbuild siga en devDependencies de la raiz."
            exit 1
          fi
          echo "${BIN}" >> "$GITHUB_PATH"
          "${BIN}/esbuild" --version

      # ------------------------------------------------------------------
      # OIDC credentials: assume spark-match-sam-deploy-<env> in the
      # 681526276858 AWS account. The role is created by
      # 02-infrastructure/modules/oidc-github (Fase 1 applied to dev).
      # The role ARN is computed inline from inputs.environment so this
      # file does not depend on a per-env repo var that would drift
      # between dev / staging / prod.
      #
      # aws-region is fixed to us-east-1; the SAM artifacts bucket,
      # all KMS keys, all VPCs, and the SAM-deploy role are scoped to
      # that region per 02-infrastructure's design.
      # ------------------------------------------------------------------
      - name: configure-aws-credentials-oidc-deploy
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::681526276858:role/spark-match-sam-deploy-${{ inputs.environment }}
          aws-region: us-east-1

      # ------------------------------------------------------------------
      # Config de red y CORS desde SSM (contrato ADR-0002, publicado por
      # modules/ssm-bootstrap en 02-infrastructure).
      #
      # Sin este paso las Lambdas quedan FUERA de la VPC: la condicion
      # `HasVpcConfig` del template evalua a false cuando VpcSubnetIds llega
      # vacio, que es exactamente lo que pasaba porque nadie pasaba el
      # parametro. Una Lambda sin VPC no llega al RDS privado.
      #
      # Las comas NO se escapan. `sam deploy --parameter-overrides` separa
      # los pares Key=Value por ESPACIOS, no por comas: un valor con comas
      # viaja intacto y CloudFormation es quien parte el CommaDelimitedList.
      # El escape `\,` que habia aca metia el backslash literal en el valor
      # y Lambda rechazaba la subnet resultante:
      #   Value '[subnet-...\, subnet-...]' at 'vpcConfig.subnetIds' failed
      #   to satisfy constraint ... pattern: subnet-[0-9a-z]*
      # ------------------------------------------------------------------
      - name: read-network-and-cors-config-from-ssm
        id: config
        env:
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          get() {
            aws ssm get-parameter --name "/spark-match/${ENV_NAME}/config/$1" \
              --query Parameter.Value --output text
          }
          SUBNETS="$(get private-subnet-ids)"
          SGS="$(get lambda-security-group-id)"
          CORS="$(get cors-allowed-origins)"

          if [ -z "${SUBNETS}" ] || [ "${SUBNETS}" = "None" ]; then
            echo "::error::/spark-match/${ENV_NAME}/config/private-subnet-ids vacio: las Lambdas quedarian fuera de la VPC y no alcanzarian RDS."
            exit 1
          fi

          {
            echo "subnets=${SUBNETS}"
            echo "security-groups=${SGS}"
            echo "cors=${CORS}"
          } >> "$GITHUB_OUTPUT"

          echo "subnets=${SUBNETS} | sgs=${SGS} | cors=${CORS}"

      # `--use-container` no aplica: el empaquetado es esbuild + un makefile
      # que solo llama a esbuild y copia migrations/. Levantar la imagen de
      # build de Lambda solo agregaria minutos y una dependencia de Docker.
      - name: sam-build
        run: sam build

      - name: sam-deploy
        env:
          ENV_NAME: ${{ inputs.environment }}
          RETENTION: ${{ inputs.environment == 'prod' && '365' || '14' }}
          SUBNETS: ${{ steps.config.outputs.subnets }}
          SGS: ${{ steps.config.outputs.security-groups }}
          CORS: ${{ steps.config.outputs.cors }}
        run: |
          set -euo pipefail
          sam deploy \
            --config-env "${ENV_NAME}" \
            --no-fail-on-empty-changeset \
            --no-disable-rollback \
            --parameter-overrides \
              "Environment=${ENV_NAME}" \
              "LogRetentionInDays=${RETENTION}" \
              "VpcSubnetIds=${SUBNETS}" \
              "VpcSecurityGroupIds=${SGS}" \
              "CorsAllowedOrigins=${CORS}"

      # ------------------------------------------------------------------
      # Migraciones de base de datos.
      #
      # VA DESPUES DE sam-deploy Y NO PUEDE IR ANTES. Los .sql viajan DENTRO
      # del artefacto de la Lambda migradora: scripts/bundle-migrate.mjs los
      # copia al bundle y el handler los lee en runtime de /var/task/migrations
      # con resolve(process.cwd(), 'migrations'). Invocar antes de desplegar
      # ejecuta el codigo viejo, que no conoce la migracion nueva y responde
      # `{"applied":[]}`: exito aparente sin haber aplicado nada. La cabecera
      # de migrations/005 llego a recomendar ese orden imposible; se corrigio
      # en este mismo commit.
      #
      # Consecuencia que este paso elimina: entre que `sam deploy` termina y
      # alguien se acuerda de invocar la Lambda a mano, el codigo nuevo corre
      # contra el esquema viejo. Con la 005 eso significo que cada alta
      # insertaba role='student' contra un CHECK que solo admitia 'admin', o
      # sea registro roto durante una ventana que duraba lo que tardase el
      # humano. Ahora dura lo que tarde este paso.
      #
      # Por que inline y no receta (AGENTS.md §12.2): en el catalogo de
      # spark-match-01-devops no hay ninguna receta que invoque Lambdas -- un
      # grep de `aws lambda` sobre sus 28 reusables no devuelve ni una. La mas
      # parecida, reusable-migrations-dry-run.yml, es incompatible por diseno
      # y no por configuracion: corre migrate:up contra un postgres:17
      # efimero y declara `permissions: contents: read` sin `id-token: write`,
      # asi que no puede asumir un rol AWS ni alcanzar RDS. Que haria falta
      # para consolidarlo: un `reusable-lambda-invoke.yml` con inputs
      # {function-name, payload, role-arn, gh-environment}. No se propone hoy
      # porque tendria un unico consumidor, que es exactamente como nacio la
      # primitiva `aws-lambda-invoke` que 01-devops acabo borrando por no
      # tener ninguno.
      #
      # LA TRAMPA, que es la razon de que este paso no sea una linea:
      # `aws lambda invoke` termina con codigo 0 aunque la funcion reviente.
      # El exit code describe la llamada a la API de Lambda, no el resultado
      # del handler, y StatusCode vale 200 en los dos casos. migrate.ts no
      # captura sus errores, los relanza (handlers/migrate.ts:162-166), y ese
      # throw se manifiesta unicamente como FunctionError en la respuesta del
      # invoke. Gatear en cualquier otro sitio deja pasar en verde una
      # migracion fallida.
      # ------------------------------------------------------------------
      - name: apply-database-migrations
        env:
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          FN="$(aws cloudformation describe-stacks \
            --stack-name "spark-match-backend-${ENV_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='IdentityMigrateFunctionArn'].OutputValue" \
            --output text)"
          if [ -z "${FN}" ] || [ "${FN}" = "None" ]; then
            echo "::error::el stack no expone IdentityMigrateFunctionArn"
            exit 1
          fi
          echo "Funcion migradora: ${FN}"

          # `--output text` sobre un campo ausente imprime literalmente None,
          # por eso la comparacion es exacta y no un test de cadena vacia.
          run_migrate() {
            local direction="$1" out="$2"
            local fn_err
            fn_err="$(aws lambda invoke \
              --function-name "${FN}" \
              --payload "{\"direction\":\"${direction}\"}" \
              --cli-binary-format raw-in-base64-out \
              --query 'FunctionError' --output text \
              "${out}")"

            cat "${out}"
            echo

            if [ "${fn_err}" != "None" ]; then
              echo "::error::migrate ${direction} fallo (${fn_err}): $(jq -r '(.errorType // "?") + ": " + (.errorMessage // "?")' "${out}")"
              return 1
            fi

            # El runtime de Node serializa solo errorType/errorMessage/trace:
            # statusCode y code de ApiError NO viajan, asi que no sirve
            # filtrar por ellos. Se comprueba la forma del exito en su lugar.
            jq -e 'has("direction") and (.applied | type == "array") and (.log | type == "array")' \
              "${out}" > /dev/null \
              || { echo "::error::la respuesta de migrate ${direction} no cumple MigrateOutput"; return 1; }
          }

          run_migrate up /tmp/migrate-up.json
          echo "Aplicadas en esta corrida: $(jq -c '.applied' /tmp/migrate-up.json)"

          # NO se gatea sobre "applied no vacio". Un `up` sin nada pendiente
          # devuelve [] y eso es exito legitimo -- es lo que pasa en la
          # inmensa mayoria de deploys, que no traen migracion nueva.
          #
          # La asercion util es la de abajo: `status` corre en dryRun y
          # devuelve en `applied` lo que QUEDA por aplicar. Si tras el `up`
          # sigue quedando algo, el esquema no se corresponde con el codigo
          # que se acaba de desplegar y el deploy no debe darse por bueno.
          run_migrate status /tmp/migrate-status.json
          PENDING="$(jq -c '.applied' /tmp/migrate-status.json)"
          if [ "${PENDING}" != "[]" ]; then
            echo "::error::quedan migraciones sin aplicar tras el up: ${PENDING}"
            exit 1
          fi
          echo "Sin migraciones pendientes."

      # ------------------------------------------------------------------
      # Smoke test post-deploy. Un `sam deploy` verde solo dice que
      # CloudFormation creo los recursos, NO que el codigo arranque: el
      # 2026-08-05 el stack quedo en UPDATE_COMPLETE con las 12 funciones
      # muertas en el init (bundle ESM sin el shim de createRequire) y con
      # el authorizer ininvocable por falta de Lambda::Permission. Ambos
      # bugs pasaron el deploy y solo apareceieron al pegarle a la API.
      #
      # Las dos sondas no escriben nada -- ni un usuario de prueba en RDS:
      #
      #   login con credenciales falsas -> 401
      #     Discrimina "la funcion arranca y responde" de "murio en el
      #     init". Un Init Error sale como 500.
      #
      #   users/me con un Bearer invalido -> 403
      #     Discrimina "API Gateway puede invocar el authorizer" de "no
      #     tiene permiso" (500). OJO: sin header Authorization la API
      #     corta con 401 sin llegar a invocarlo, asi que esa variante no
      #     prueba nada del authorizer.
      # ------------------------------------------------------------------
      - name: smoke-test
        env:
          ENV_NAME: ${{ inputs.environment }}
          BOGUS_TOKEN: smoke-probe-invalid
        run: |
          set -euo pipefail
          API="$(aws cloudformation describe-stacks \
            --stack-name "spark-match-backend-${ENV_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" \
            --output text)"
          if [ -z "${API}" ] || [ "${API}" = "None" ]; then
            echo "::error::el stack no expone HttpApiUrl"
            exit 1
          fi
          echo "API: ${API}"

          probe() {
            local name="$1" expected="$2" got="$3"
            if [ "${got}" != "${expected}" ]; then
              echo "::error::${name}: esperaba HTTP ${expected}, obtuvo ${got}"
              return 1
            fi
            echo "  ok ${name}: HTTP ${got}"
          }

          LOGIN_CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "${API}/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke-probe@invalid.local","password":"not-a-real-password"}')"

          # El header se arma en una variable en vez de escribirlo inline en el
          # curl: la regla `curl-auth-header` de gitleaks marca cualquier
          # `-H "Authorization: ..."` literal, y tiene razon en hacerlo. El
          # valor es un placeholder que el authorizer debe rechazar.
          BOGUS_HEADER="Authorization: Bearer ${BOGUS_TOKEN}"
          AUTHZ_CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            "${API}/v1/users/me" -H "${BOGUS_HEADER}")"

          FAILED=0
          probe "login responde (handler vivo)" 401 "${LOGIN_CODE}" || FAILED=1
          probe "authorizer invocable"          403 "${AUTHZ_CODE}" || FAILED=1

          if [ "${FAILED}" -ne 0 ]; then
            echo "::error::El deploy creo los recursos pero la API no responde como debe. Revisa los log groups /aws/lambda/spark-match-identity-*-${ENV_NAME}."
            exit 1
          fi
          echo "Smoke test OK."
