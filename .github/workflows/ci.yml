name: CI

# SIN `paths-ignore` A PROPOSITO. NO LO VUELVAS A ANADIR.
#
# Aqui vivia un filtro de nueve patrones (NB-7) que saltaba la suite entera
# en pull requests de solo documentacion. La lista era deliberadamente
# explicita, no un `*.md` generico, y el razonamiento estaba bien escrito.
# Aun asi hay que quitarlo, por una razon que el comentario original no podia
# ver: un filtro de `paths` y un check requerido son incompatibles por
# construccion. Si el filtro no casa, el workflow no corre; si no corre, el
# check no se publica; y un check requerido que no se publica deja el pull
# request en "Expected - waiting for status to be reported" para siempre.
#
# Hasta el 2026-08-07 no rompia nada, y por un motivo que no consuela: el
# ruleset de este repositorio NO tenia regla `required_status_checks`. Los
# catorce checks de cada pull request eran decorativos, asi que daba igual
# cuales se publicaran. El filtro se quita ANTES de declarar los contextos
# requeridos, no despues, porque ese orden es justamente el que evita colgar
# el primer pull request de documentacion que llegue.
#
# El alcance, medido el 2026-08-07: 45 de los 190 ficheros del repositorio
# casaban con la lista, incluidos los 17 ADR de `docs/adr/`. O sea que la
# forma canonica de registrar una decision de arquitectura era tambien la
# unica que no pasaba por CI.
#
# Es el cuarto incidente de la misma familia en el proyecto, y todos comparten
# la forma: la verificacion falla en abierto y en silencio. Los otros tres
# estan en el manifiesto de governance de 01-devops y en la seccion 13.2 de su
# AGENTS.md.
#
# El coste de quitarlo es que un pull request de solo documentacion corre la
# suite completa, unos 3 minutos. Si algun dia molesta, la solucion NO es
# volver a poner `paths-ignore`, sino filtrar DENTRO del job: un primer step
# que decida si hay trabajo y salga en verde si no lo hay. Asi el check se
# sigue publicando.
#
# `workflow_dispatch` esta aqui por una razon concreta, no por simetria con
# 02-infrastructure. Reejecutar un run NO recoge un arreglo hecho en un
# reusable: GitHub fija la definicion de los workflows llamados en el momento
# en que el run se CREA, y un re-run reproduce esa version. El 2026-08-07
# costo tres reejecuciones descubrirlo, sobre un fallo de commitlint que ya
# estaba arreglado en 01-devops y que el run no podia ver.
#
# Sin un disparador manual, la unica forma de estrenar una receta corregida es
# inventarse un commit. Con este, se lanza y ya esta.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# PR-aware concurrency: cancel in-progress CI runs for the same PR/ref.
# Closes B15 (governance gap vs 02-infrastructure). Without this, a push
# to a PR branch while CI is running spawns a parallel run that wastes
# minutes of runner time. ci.yml deploys its own group here because
# recipes in §10.2 (sonar-typescript, etc.) own their own concurrency
# blocks; we don't want a deadlock with the caller.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-sonar-typescript.yml@main
    with:
      project-key: ${{ vars.SONAR_PROJECT_KEY }}
      project-name: ${{ vars.SONAR_PROJECT_NAME }}
      organization: ${{ vars.SONAR_ORGANIZATION }}
      sources: ${{ vars.SONAR_SOURCES }}
      tests: ${{ vars.SONAR_TESTS }}
      test-inclusions: ${{ vars.SONAR_TEST_INCLUSIONS }}
      exclude-patterns: ${{ vars.SONAR_EXCLUDE_PATTERNS }}
      working-directory: '.'
      env: 'ci'
      node-version: ${{ vars.DEFAULT_NODE_VERSION }}
      package-manager: ${{ vars.PACKAGE_MANAGER }}
      lockfile-name: ${{ vars.LOCKFILE_NAME }}
      install-command: 'npm ci && npm run build:shared'
      test-command: 'npx vitest run --coverage --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 --coverage.reporter=lcov'
      coverage-paths: 'coverage/lcov.info'
      fail-on-quality-gate: ${{ vars.SONAR_FAIL_ON_QUALITY_GATE }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # SPRINT 2 - migrations-dry-run: catches SQL sequence bugs (CHECK constraints,
  # FK violations, idempotency failures) at PR time. Uses an ephemeral
  # postgres:17 service container via the devops reusable workflow.
  # No AWS credentials, no access to RDS. Tracking table matches backend
  # package.json:migrate:* scripts (spark_match_migrations). See ADR-016.
  migrations-dry-run:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-migrations-dry-run.yml@main
    with:
      environment-name: 'ci'
      postgres-version: '17'
      postgres-user: 'postgres'
      postgres-password: 'postgres'
      postgres-db: 'spark_match_test'
      migrations-dir: 'migrations'
      migrations-table: 'spark_match_migrations'
      migrations-schema: 'public'
      node-version: '24'
      working-directory: '.'
      npm-script: 'migrate:up'
      timeout-minutes: 10

  # constraints-check: lo mismo que migrations-dry-run pero, ademas de aplicar
  # las migraciones, INSERTA contra el postgres:17 efimero. Comprueba que las
  # restricciones hacen lo que la migracion dice: que el indice unico parcial
  # rechaza un segundo informe en curso, que un `ready` incompleto no entra, y
  # que el driver devuelve NUMERIC como string y DATE en hora local -- las dos
  # coacciones que el repositorio compensa.
  #
  # Existe porque `migrations-dry-run` solo aplica DDL. Un CHECK mal escrito se
  # crea sin protestar y no se descubre hasta que alguien mete la fila que
  # deberia haber rechazado, en produccion y semanas despues.
  #
  # Mismo reusable, otro npm-script: `test:db` corre `migrate:up` y luego los
  # `*.itest.ts`, que no entran en `npm test` porque no casan con el patron
  # `*.test.ts` del config de unidad.
  constraints-check:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-migrations-dry-run.yml@main
    with:
      environment-name: 'constraints'
      postgres-version: '17'
      postgres-user: 'postgres'
      postgres-password: 'postgres'
      postgres-db: 'spark_match_test'
      migrations-dir: 'migrations'
      migrations-table: 'spark_match_migrations'
      migrations-schema: 'public'
      node-version: '24'
      working-directory: '.'
      npm-script: 'test:db'
      timeout-minutes: 10

  # sam-validate: expande el transform AWS::Serverless-2016-10-31 y corre
  # cfn-lint sobre el resultado, que es exactamente lo que hace CloudFormation
  # al crear el changeset. Sin este gate, un template invalido solo se descubre
  # desplegando: el 2026-08-05 los 10 errores del nested stack de identity
  # (ThrottleSettings inexistente en HttpApi, Authorizer por !Ref en vez de por
  # nombre) costaron un ciclo completo de deploy + rollback + limpieza del
  # stack. `sam validate --lint` los reproduce en ~20 s.
  #
  # Inline y no reusable: 01-devops no tiene una receta de SAM (la que habia se
  # borro en la limpieza de PR #201/#202, ver AGENTS.md §11).
  #
  # No necesita credenciales AWS: --lint es cfn-lint local. Solo la region,
  # que se pasa por flag para no depender de la config del runner.
  sam-validate:
    name: "sam-validate-ci"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-aws-sam-cli
        uses: aws-actions/setup-sam@v3

      # Uno por template: el root incluye los nested via AWS::CloudFormation::Stack
      # con una Location local, que sam validate no sigue. Un template anidado
      # nuevo que no se anada aqui pasa el CI sin validarse.
      - name: validate-root-template
        run: sam validate --template template.yaml --region us-east-1 --lint

      - name: validate-identity-template
        run: sam validate --template contexts/identity/template.yaml --region us-east-1 --lint

      - name: validate-reports-template
        run: sam validate --template contexts/reports/template.yaml --region us-east-1 --lint

  actionlint:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-actionlint.yml@main
    with:
      environment-name: 'ci'

  eslint:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-eslint.yml@main
    with:
      environment-name: 'ci'
      node-version: '24'
      eslint-version: 10
      lint-script: lint

  # SPRINT 6 - node-typecheck: catches TypeScript regressions at PR time.
  # Inline job (NOT a reusable) because reusable-node-typecheck.yml from
  # spark-match-01-devops does not expose a pre-typecheck-script input,
  # and this monorepo requires `npm run build:shared` before `tsc --noEmit`
  # (the @spark-match/shared/* imports resolve via npm-workspace symlink
  # to shared/dist, which is built by build:shared). Without build:shared,
  # typecheck fails with "Cannot find module '@spark-match/shared/infra'".
  # See AGENTS.md §3 and §8 for the path-alias resolution rule.
  #
  # What would change to migrate to the reusable:
  #   - 01-devops adds `pre-typecheck-script` input to reusable-node-typecheck.yml
  #     (analogous to the `pre-build-script` input on reusable-node-build.yml).
  #   - Out of scope here per AGENTS.md §11 (we do not modify devops recipes).
  #
  # The build:shared step relies on the fix shipped in PR #130 (shared
  # build script -> 'tsc -b --force'). Without that fix, the build step
  # silently no-ops on a clean runner and the typecheck step fails.
  node-typecheck:
    name: "node-typecheck-ci"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-node-js-24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: install-dependencies
        run: npm ci

      # Build @spark-match/shared first so its .d.ts files are available
      # via the shared workspace symlink. See shared/package.json exports
      # map and the AGENTS.md §8 "path-alias resolution" rule.
      - name: build-shared-workspace
        run: npm run build:shared

      - name: run-typecheck
        run: npm run typecheck

  # SPRINT 6 - node-test: runs vitest as a dedicated PR gate.
  # Uses reusable-node-test.yml from spark-match-01-devops. The recipe
  # exposes a pre-test-script input, but we leave it empty because
  # vitest uses vite-tsconfig-paths to resolve @spark-match/shared/*
  # to shared/src directly (no shared/dist build required for tests).
  # The sonar job continues to run vitest with --coverage to produce
  # the LCOV report for SonarCloud. This job produces fast test-only
  # feedback (~30s) without the cost of running coverage again.
  node-test:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-node-test.yml@main
    with:
      environment-name: 'ci'
      node-version: '24'
      test-script: 'test'

  # SPRINT 6 - commitlint: enforces Conventional Commits on PR commits.
  # Closes B13. Uses reusable-commitlint.yml from spark-match-01-devops.
  # Evaluates the PR's commit subjects (default depth: 2) against the
  # local .commitlintrc.json. help-url points to AGENTS.md §4.2 so
  # failure messages direct contributors to the project's commit
  # conventions.
  #
  # NOT enabling post-merge `commitlint-main` required check (which
  # 01-devops uses in PR #276): a single-author project with admin
  # bypass for merge means the post-merge check has no incremental
  # catch value beyond what the PR-side check already provides.
  # Revisit when a second CODEOWNER exists.
  commitlint:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-commitlint.yml@main
    with:
      help-url: 'https://github.com/spark-match/spark-match-03-backend/blob/main/AGENTS.md#4-pull-request-workflow'
      skip-release-please: true

  gitleaks:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-gitleaks.yml@main
    with:
      environment-name: 'ci'
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  yamllint:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-yamllint.yml@main
    with:
      environment-name: 'ci'
