name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    uses: spark-match/spark-match-01-devops/.github/workflows/sonar-typescript.yml@main
    with:
      project-key: ${{ vars.SONAR_PROJECT_KEY }}
      project-name: Spark Match - Backend
      organization: ahincho
      sources: contexts,shared,events,layers
      tests: contexts,shared,tests
      test-inclusions: '**/*.test.ts'
      exclude-patterns: '**/dist/**,**/node_modules/**,**/coverage/**,**/.aws-sam/**,**/*.d.ts'
      working-directory: '.'
      env: 'ci'
      node-version: '24'
      package-manager: 'npm'
      lockfile-name: 'package-lock.json'
      install-command: 'echo install skip'
      test-command: 'echo test skip'
      coverage-paths: 'coverage/lcov.info'
      fail-on-quality-gate: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
