name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-sonar-typescript.yml@main
    with:
      project-key: ${{ vars.SONAR_PROJECT_KEY }}
      project-name: ${{ vars.SONAR_PROJECT_NAME }}
      organization: ${{ vars.SONAR_ORGANIZATION }}
      sources: ${{ vars.SONAR_SOURCES }}
      tests: ${{ vars.SONAR_TESTS }}
      test-inclusions: ${{ vars.SONAR_TEST_INCLUSIONS }}
      exclude-patterns: ${{ vars.SONAR_EXCLUDE_PATTERNS }}
      working-directory: '.'
      env: 'ci'
      node-version: ${{ vars.DEFAULT_NODE_VERSION }}
      package-manager: ${{ vars.PACKAGE_MANAGER }}
      lockfile-name: ${{ vars.LOCKFILE_NAME }}
      install-command: 'npm ci && npm run build:shared'
      test-command: 'npx vitest run --coverage --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 --coverage.reporter=lcov'
      coverage-paths: 'coverage/lcov.info'
      fail-on-quality-gate: ${{ vars.SONAR_FAIL_ON_QUALITY_GATE }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # SPRINT 2 - migrations-dry-run: catches SQL sequence bugs (CHECK constraints,
  # FK violations, idempotency failures) at PR time. Uses an ephemeral
  # postgres:17 service container via the devops reusable workflow.
  # No AWS credentials, no access to RDS. Tracking table matches backend
  # package.json:migrate:* scripts (spark_match_migrations). See ADR-016.
  migrations-dry-run:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-migrations-dry-run.yml@main
    with:
      environment-name: 'ci'
      postgres-version: '17'
      postgres-user: 'postgres'
      postgres-password: 'postgres'
      postgres-db: 'spark_match_test'
      migrations-dir: 'migrations'
      migrations-table: 'spark_match_migrations'
      migrations-schema: 'public'
      node-version: '24'
      working-directory: '.'
      npm-script: 'migrate:up'
      timeout-minutes: 10

  actionlint:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-actionlint.yml@main
    with:
      environment-name: 'ci'

  eslint:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-eslint.yml@main
    with:
      environment-name: 'ci'
      node-version: '24'
      eslint-version: 10
      lint-script: lint

  # SPRINT 6 - node-typecheck: catches TypeScript regressions at PR time.
  # Inline job (NOT a reusable) because reusable-node-typecheck.yml from
  # spark-match-01-devops does not expose a pre-typecheck-script input,
  # and this monorepo requires `npm run build:shared` before `tsc --noEmit`
  # (the @spark-match/shared/* imports resolve via npm-workspace symlink
  # to shared/dist, which is built by build:shared). Without build:shared,
  # typecheck fails with "Cannot find module '@spark-match/shared/infra'".
  # See AGENTS.md §3 and §8 for the path-alias resolution rule.
  #
  # What would change to migrate to the reusable:
  #   - 01-devops adds `pre-typecheck-script` input to reusable-node-typecheck.yml
  #     (analogous to the `pre-build-script` input on reusable-node-build.yml).
  #   - Out of scope here per AGENTS.md §11 (we do not modify devops recipes).
  #
  # The build:shared step relies on the fix shipped in PR #130 (shared
  # build script -> 'tsc -b --force'). Without that fix, the build step
  # silently no-ops on a clean runner and the typecheck step fails.
  node-typecheck:
    name: "node-typecheck-ci"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node-js-24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: install-dependencies
        run: npm ci

      # Build @spark-match/shared first so its .d.ts files are available
      # via the shared workspace symlink. See shared/package.json exports
      # map and the AGENTS.md §8 "path-alias resolution" rule.
      - name: build-shared-workspace
        run: npm run build:shared

      - name: run-typecheck
        run: npm run typecheck

  # SPRINT 6 - node-test: runs vitest as a dedicated PR gate.
  # Uses reusable-node-test.yml from spark-match-01-devops. The recipe
  # exposes a pre-test-script input, but we leave it empty because
  # vitest uses vite-tsconfig-paths to resolve @spark-match/shared/*
  # to shared/src directly (no shared/dist build required for tests).
  # The sonar job continues to run vitest with --coverage to produce
  # the LCOV report for SonarCloud. This job produces fast test-only
  # feedback (~30s) without the cost of running coverage again.
  node-test:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-node-test.yml@main
    with:
      environment-name: 'ci'
      node-version: '24'
      test-script: 'test'

  gitleaks:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-gitleaks.yml@main
    with:
      environment-name: 'ci'
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  yamllinks:
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-yamllint.yml@main
    with:
      environment-name: 'ci'
