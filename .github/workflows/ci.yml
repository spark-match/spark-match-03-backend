name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-checks:
    uses: spark-match/01-devops/.github/workflows/quality-checks.yml@main
    with:
      working-directory: .
      node-version: '20'
      run-shared-tests: 'true'
      run-contexts-tests: 'true'

  sonar:
    needs: quality-checks
    uses: spark-match/spark-match-01-devops/.github/workflows/sonar-typescript.yml@main
    with:
      project-key: ${{ vars.SONAR_PROJECT_KEY }}
      project-name: ${{ vars.SONAR_PROJECT_NAME }}
      organization: ${{ vars.SONAR_ORGANIZATION }}
      sources: ${{ vars.SONAR_SOURCES }}
      tests: ${{ vars.SONAR_TESTS }}
      exclude-patterns: ${{ vars.SONAR_EXCLUDE_PATTERNS }}
      working-directory: '.'
      env: 'ci'
      node-version: ${{ vars.DEFAULT_NODE_VERSION }}
      package-manager: ${{ vars.PACKAGE_MANAGER }}
      lockfile-name: ${{ vars.LOCKFILE_NAME }}
      install-command: 'npm ci'
      test-command: 'npm run test:coverage'
      coverage-paths: 'coverage/lcov.info'
      fail-on-quality-gate: ${{ vars.SONAR_FAIL_ON_QUALITY_GATE }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
