name: OIDC trust probe (throwaway)

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::681526276858:role/spark-match-sam-deploy-dev
          aws-region: us-east-1
      - run: aws sts get-caller-identity
